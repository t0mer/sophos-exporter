# goreleaser config — builds static binaries, a GitHub Release, and multi-arch
# Docker images pushed to Docker Hub (techblog/sophos-exporter) and GHCR.
# Version scheme is date-based YYYY.M.PATCH, driven by the git tag (v2026.7.0).
version: 2

project_name: sophos-exporter

before:
  hooks:
    - go mod tidy

builds:
  - id: sophos-exporter
    main: ./cmd/sophos-exporter
    binary: sophos-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/t0mer/sophos-exporter/internal/version.Version={{ .Version }}
      - -X github.com/t0mer/sophos-exporter/internal/version.Commit={{ .Commit }}
      - -X github.com/t0mer/sophos-exporter/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.yml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Per-arch images (arm64 is a first-class target for the home-lab deployment).
dockers:
  - image_templates:
      - "techblog/sophos-exporter:{{ .Version }}-amd64"
      - "ghcr.io/t0mer/sophos-exporter:{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=sophos-exporter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/t0mer/sophos-exporter"
  - image_templates:
      - "techblog/sophos-exporter:{{ .Version }}-arm64"
      - "ghcr.io/t0mer/sophos-exporter:{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=sophos-exporter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/t0mer/sophos-exporter"

# Multi-arch manifests: :<version> and :latest on both registries.
docker_manifests:
  - name_template: "techblog/sophos-exporter:{{ .Version }}"
    image_templates:
      - "techblog/sophos-exporter:{{ .Version }}-amd64"
      - "techblog/sophos-exporter:{{ .Version }}-arm64"
  - name_template: "techblog/sophos-exporter:latest"
    image_templates:
      - "techblog/sophos-exporter:{{ .Version }}-amd64"
      - "techblog/sophos-exporter:{{ .Version }}-arm64"
  - name_template: "ghcr.io/t0mer/sophos-exporter:{{ .Version }}"
    image_templates:
      - "ghcr.io/t0mer/sophos-exporter:{{ .Version }}-amd64"
      - "ghcr.io/t0mer/sophos-exporter:{{ .Version }}-arm64"
  - name_template: "ghcr.io/t0mer/sophos-exporter:latest"
    image_templates:
      - "ghcr.io/t0mer/sophos-exporter:{{ .Version }}-amd64"
      - "ghcr.io/t0mer/sophos-exporter:{{ .Version }}-arm64"

release:
  github:
    owner: t0mer
    name: sophos-exporter
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
