name: Docker

# Multi-arch image publishing, decoupled from the Release workflow.
#   - workflow_run: fires after a successful Release and REUSES that tag.
#   - workflow_dispatch: standalone run that computes the next YYYY.M.PATCH and
#     pushes the tag after a successful build, so the patch auto-increments.
# The git tag is the single source of truth for the version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank = auto-increment YYYY.M.PATCH from latest tag)"
        required: false
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write # push the version tag that drives auto-increment
  packages: write # push images to GHCR

jobs:
  docker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags needed to compute/inspect the version

      # Resolve version (never `git describe` alone): input -> latest tag
      # (Release-triggered) -> next-version.sh (manual). Image tags are the bare
      # version; git tags are v-prefixed (aligned with the Release workflow).
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          NEEDS_TAG=true
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            TAG="$(git describe --tags --abbrev=0)"   # Release already created it
            VERSION="${TAG#v}"
            NEEDS_TAG=false
          else
            VERSION="$(./scripts/next-version.sh)"     # manual run: bump patch
          fi
          [ -n "$VERSION" ] || { echo "::error::could not resolve a version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "needs_tag=$NEEDS_TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            techblog/sophos-exporter:latest
            techblog/sophos-exporter:${{ steps.version.outputs.version }}
            ghcr.io/t0mer/sophos-exporter:latest
            ghcr.io/t0mer/sophos-exporter:${{ steps.version.outputs.version }}

      # Tag AFTER a successful push so the next manual run increments. Skipped on
      # Release-driven runs (the Release workflow owns its tag).
      - name: Tag published version
        if: steps.version.outputs.needs_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
