# goreleaser config — builds static binaries, a GitHub Release, and multi-arch
# Docker images pushed to Docker Hub (techblog/sophos-exporter) and GHCR.
# Version scheme is date-based YYYY.M.PATCH, driven by the git tag (v2026.7.0).
version: 2

project_name: sophos-exporter

before:
  hooks:
    - go mod tidy

builds:
  - id: sophos-exporter
    main: ./cmd/sophos-exporter
    binary: sophos-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/t0mer/sophos-exporter/internal/version.Version={{ .Version }}
      - -X github.com/t0mer/sophos-exporter/internal/version.Commit={{ .Commit }}
      - -X github.com/t0mer/sophos-exporter/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.yml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Docker images are intentionally NOT built here. Image publishing is decoupled
# into .github/workflows/docker.yml (multi-arch buildx: amd64/arm64/arm/v7),
# triggered on Release completion or manual dispatch. See docker-releases.md.

release:
  github:
    owner: t0mer
    name: sophos-exporter
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
